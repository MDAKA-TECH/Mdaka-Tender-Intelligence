<!doctype html>
<html lang="en-ZA">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Tender Intelligence · Mdaka Tech</title>
    <meta name="description" content="Upload a tender and get every deadline, returnable document and disqualification rule, each with the page it came from. By Mdaka Advanced Technologies." />
    <meta name="theme-color" content="#1a2a5e" />
    <meta name="color-scheme" content="light dark" />
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="apple-mobile-web-app-title" content="Tenders" />

    <!-- Link previews (WhatsApp, LinkedIn, email) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Tender Intelligence" />
    <meta property="og:title" content="Tender Intelligence by Mdaka Tech" />
    <meta property="og:description" content="Upload a tender. Get every deadline, returnable document and disqualifier, each with its source page." />
    <meta property="og:url" content="https://mdaka-tender-intelligence.vercel.app/" />
    <meta property="og:image" content="https://mdaka-tender-intelligence.vercel.app/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />

    <!-- Shown until the app starts, so the page is never a blank white flash -->
    <style>
      html, body { margin: 0; background: #edf0f6; }
      @media (prefers-color-scheme: dark) { html, body { background: #0d111d; } }
      .boot { min-height: 100vh; display: grid; place-items: center; }
      .boot img { width: 56px; height: 56px; animation: boot-pulse 1.4s ease-in-out infinite; }
      @keyframes boot-pulse { 50% { opacity: 0.55; transform: scale(0.94); } }
      @media (prefers-reduced-motion: reduce) { .boot img { animation: none; } }
    </style>
  </head>
  <body>
    <div id="root"><div class="boot" aria-label="Loading Tender Intelligence"><img src="/favicon.svg" alt="" /></div></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
